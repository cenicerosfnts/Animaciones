# Publica el editor en GitHub Pages: https://<usuario>.github.io/<repositorio>/
# Una sola vez: Settings → Pages → Source: "GitHub Actions".
name: Publicar editor

on:
  push:
    branches: [main]
    paths: ["editor/**", "animaciones/editor_web.py", ".github/workflows/editor-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "from animaciones.editor_web import construir; construir('_site')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
